<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071019"><title>Privora Web</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#061018;color:#eef6f8;font:15px system-ui,-apple-system,Segoe UI,sans-serif;height:100vh;overflow:hidden}
.app{height:100vh;display:grid;grid-template-columns:300px 1fr;max-width:1400px;margin:auto;background:#09131d}.side{border-right:1px solid #1b2a38;display:flex;flex-direction:column}.brand{padding:18px;display:flex;gap:12px;align-items:center;border-bottom:1px solid #1b2a38}.logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,#67e8c0,#60a5fa);display:grid;place-items:center;color:#041018;font-weight:900;font-size:22px}.brand b{font-size:20px}.brand small{display:block;color:#8293a5}.section{padding:14px;border-bottom:1px solid #1b2a38}.section label{font-size:11px;color:#7f91a5;text-transform:uppercase;letter-spacing:.08em}.row{display:flex;gap:7px;margin-top:8px}input,textarea,button{font:inherit}input,textarea{background:#07111a;border:1px solid #203140;color:#fff;border-radius:11px;padding:10px;outline:none}input{width:100%}button{background:#162638;border:0;color:#edf5f7;border-radius:10px;padding:10px 12px;cursor:pointer}button:hover{filter:brightness(1.15)}.primary{background:linear-gradient(135deg,#36c998,#4d9df5);color:#041018;font-weight:800}.contacts{overflow:auto;flex:1}.contact{padding:12px 15px;border-bottom:1px solid #142431;cursor:pointer;display:flex;gap:10px;align-items:center}.contact:hover,.contact.active{background:#102131}.av{width:39px;height:39px;border-radius:50%;background:linear-gradient(135deg,#1d4ed8,#059669);display:grid;place-items:center;font-weight:800;flex:none}.contact small{color:#7f91a5}.online{width:8px;height:8px;background:#62e6b4;border-radius:50%;display:inline-block;margin-left:4px}.main{min-width:0;display:flex;flex-direction:column}.top{height:70px;border-bottom:1px solid #1b2a38;display:flex;align-items:center;justify-content:space-between;padding:0 17px}.peer{display:flex;gap:10px;align-items:center}.peer small{display:block;color:#8091a3}.actions{display:flex;gap:7px}.chat{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:8px}.bubble{max-width:min(650px,82%);padding:10px 13px;border-radius:16px;background:#111f2d;border:1px solid #1c3041;white-space:pre-wrap;overflow-wrap:anywhere}.bubble.mine{align-self:flex-end;background:#123c38;border-color:#1b5a51}.bubble img,.bubble video,.bubble audio{max-width:100%;border-radius:11px;display:block}.bubble a{color:#75c8ff}.meta{font-size:10px;color:#8292a3;margin-top:5px}.typing{height:20px;padding-left:20px;color:#72859a;font-size:12px}.composer{border-top:1px solid #1b2a38;padding:10px;display:flex;gap:7px}.composer textarea{flex:1;resize:none;min-height:45px;max-height:120px}.icon{width:46px;padding:0}.empty{margin:auto;text-align:center;color:#8091a3;max-width:480px}.empty b{display:block;color:#f2f7fa;font-size:20px;margin-bottom:7px}.modal{position:fixed;inset:0;background:#000b;display:none;place-items:center;padding:18px;z-index:20}.modal.show{display:grid}.card{width:min(560px,100%);background:#0c1823;border:1px solid #263949;border-radius:18px;padding:20px}.card h2{margin-top:0}.muted{color:#8798aa;line-height:1.55}.call{position:fixed;inset:0;background:#050a0f;z-index:30;display:none;flex-direction:column}.call.show{display:flex}.remote{flex:1;display:grid;place-items:center;background:#09121a}.remote video{width:100%;height:100%;object-fit:cover}.local{position:absolute;right:16px;top:16px;width:180px;height:130px;background:#111;border-radius:14px;object-fit:cover}.callbar{padding:15px;display:flex;justify-content:center;gap:10px}.danger{background:#c43e5a}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#122131;border:1px solid #2a4052;padding:10px 14px;border-radius:12px;display:none;z-index:50}.toast.show{display:block}
@media(max-width:720px){.app{grid-template-columns:1fr}.side{display:none}.top{height:62px}.chat{padding:12px}.bubble{max-width:90%}.actions button{padding:9px 8px}.local{width:120px;height:90px}}
</style></head>
<body>
<div class="app">
<aside class="side">
<div class="brand"><div class="logo">P</div><div><b>Privora</b><small>Private messenger · Web Test</small></div></div>
<div class="section"><label>Your Privora ID</label><div class="row"><input id="me" maxlength="32" placeholder="alice"><button class="primary" id="setMe">Set</button></div><div class="muted" style="font-size:11px;margin-top:7px">Share this ID with a person you trust.</div></div>
<div class="section"><label>Connect a person</label><div class="row"><input id="addId" maxlength="32" placeholder="bob"><button id="add">Add</button></div></div>
<div class="section"><label>Relay</label><div class="row"><input id="relay" placeholder="wss://your-server"><button id="connect">Go</button></div><div id="relayStatus" class="muted" style="font-size:11px;margin-top:7px">Offline</div></div>
<div class="contacts" id="contacts"></div>
<div class="section"><div class="row"><button id="security" style="flex:1">🔐 Security</button><button id="clear">Clear</button></div></div>
</aside>
<main class="main">
<header class="top"><div class="peer"><div class="av" id="peerAv">?</div><div><b id="peerName">Choose a contact</b><small id="peerStatus">Not connected</small></div></div><div class="actions"><button id="voice">☎</button><button id="video">▣</button></div></header>
<section class="chat" id="chat"><div class="empty"><b>Welcome to Privora Web</b>Add another Privora ID, connect both browsers to the same relay, then exchange messages, media and calls.</div></section>
<div class="typing" id="typing"></div>
<form class="composer" id="form"><input type="file" id="file" multiple hidden><button class="icon" type="button" id="attach">＋</button><textarea id="text" placeholder="Message…" rows="1"></textarea><button class="primary" type="submit">Send</button></form>
</main></div>
<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="card"><h2 id="mt">Privora</h2><div id="mb"></div><div class="row"><button id="mc">Close</button></div></div></div>
<div class="call" id="callScreen"><div class="remote"><div class="muted" id="callLabel">Connecting…</div><video id="remoteVideo" autoplay playsinline></video><video id="localVideo" autoplay muted playsinline class="local"></video></div><div class="callbar"><button class="danger" id="hang">End call</button></div></div>
<script>
const $=x=>document.getElementById(x);
let me=localStorage.getItem("privora.me")||"alice", current=null, ws=null, pc=null, localStream=null, online=new Set(), typingTimer=null;
let contacts=JSON.parse(localStorage.getItem("privora.contacts")||"[]");
$("me").value=me;
function toast(x){$("toast").textContent=x;$("toast").classList.add("show");setTimeout(()=>$("toast").classList.remove("show"),2600)}
function key(){return "privora.chat."+[me,current].sort().join("::")}
function msgs(){return JSON.parse(localStorage.getItem(key())||"[]")}
function saveMsgs(a){localStorage.setItem(key(),JSON.stringify(a))}
function send(o){if(ws&&ws.readyState===1)ws.send(JSON.stringify(o));else toast("Connect to the relay first")}
function renderContacts(){let c=$("contacts");c.innerHTML="";contacts.forEach(id=>{let d=document.createElement("div");d.className="contact"+(id===current?" active":"");d.innerHTML=`<div class=av>${id[0].toUpperCase()}</div><div><b>${esc(id)}</b> ${online.has(id)?'<span class=online></span>':''}<small>${online.has(id)?"Online":"Offline"}</small></div>`;d.onclick=()=>select(id);c.appendChild(d)})}
function select(id){current=id;$("peerName").textContent=id;$("peerAv").textContent=id[0].toUpperCase();$("peerStatus").textContent=online.has(id)?"Online":"Offline";render();renderContacts()}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function render(){let box=$("chat");if(!current){box.innerHTML='<div class=empty><b>Choose a contact</b>Add a Privora ID from the left panel.</div>';return}let a=msgs();box.innerHTML="";if(!a.length){box.innerHTML='<div class=empty><b>Secure conversation</b>Messages in this demo are stored in this browser only.</div>';return}a.forEach(m=>{let d=document.createElement("div");d.className="bubble "+(m.from===me?"mine":"");if(m.kind==="text")d.innerHTML=esc(m.body);else if(m.kind==="file"){let blob=new Blob([Uint8Array.from(atob(m.data),c=>c.charCodeAt(0))],{type:m.mime}),u=URL.createObjectURL(blob);if(m.mime.startsWith("image/"))d.innerHTML=`<img src="${u}"><div>${esc(m.name)}</div>`;else if(m.mime.startsWith("video/"))d.innerHTML=`<video controls src="${u}"></video><div>${esc(m.name)}</div>`;else if(m.mime.startsWith("audio/"))d.innerHTML=`<audio controls src="${u}"></audio><div>${esc(m.name)}</div>`;else d.innerHTML=`<a download="${esc(m.name)}" href="${u}">Download ${esc(m.name)}</a>`}else d.innerHTML=esc(m.body||"");d.innerHTML+=`<div class=meta>${esc(m.from)} · ${new Date(m.t).toLocaleTimeString()}</div>`;box.appendChild(d)});box.scrollTop=box.scrollHeight}
function add(m){let a=msgs();a.push(m);saveMsgs(a);render()}
$("setMe").onclick=()=>{let x=$("me").value.trim().replace(/\s+/g,"-");if(!x)return;me=x;localStorage.setItem("privora.me",me);if(ws)send({type:"register",userId:me});toast("Your ID is "+me)}
$("add").onclick=()=>{let x=$("addId").value.trim();if(!x||x===me)return;if(!contacts.includes(x))contacts.push(x);localStorage.setItem("privora.contacts",JSON.stringify(contacts));$("addId").value="";select(x)}
$("connect").onclick=()=>{let u=$("relay").value.trim();if(!u)return toast("Enter the relay URL");try{ws=new WebSocket(u)}catch{return toast("Invalid WebSocket URL")}ws.onopen=()=>{send({type:"register",userId:me});$("relayStatus").textContent="Connected";toast("Relay connected")};ws.onclose=()=>{$("relayStatus").textContent="Disconnected";online.clear();renderContacts()};ws.onerror=()=>toast("Relay connection failed");ws.onmessage=async e=>{let m;try{m=JSON.parse(e.data)}catch{return}if(m.type==="presence"){online=new Set(m.online||[]);renderContacts();if(current)$("peerStatus").textContent=online.has(current)?"Online":"Offline"}if(m.type==="message"&&m.to===me){if(!contacts.includes(m.from)){contacts.push(m.from);localStorage.setItem("privora.contacts",JSON.stringify(contacts))}add(m);toast("Message from "+m.from)}if(m.type==="typing"&&m.from===current)$("typing").textContent=m.on?m.from+" is typing…":"";if(m.type==="signal")handleSignal(m)}}
$("form").onsubmit=e=>{e.preventDefault();let t=$("text").value.trim();if(!t||!current)return;let m={type:"message",from:me,to:current,kind:"text",body:t,t:Date.now()};add(m);send(m);$("text").value=""}
$("text").oninput=()=>{if(!current)return;send({type:"typing",from:me,to:current,on:true});clearTimeout(typingTimer);typingTimer=setTimeout(()=>send({type:"typing",from:me,to:current,on:false}),700)}
$("attach").onclick=()=>$("file").click();
$("file").onchange=async()=>{if(!current)return;for(const f of $("file").files){if(f.size>8*1024*1024){toast("Demo attachment limit: 8 MB");continue}let b=new Uint8Array(await f.arrayBuffer()),s="";for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode(...b.subarray(i,i+0x8000));let m={type:"message",from:me,to:current,kind:"file",name:f.name,mime:f.type||"application/octet-stream",data:btoa(s),t:Date.now()};add(m);send(m)}$("file").value=""}
$("clear").onclick=()=>{if(confirm("Delete all local Privora web demo data?")){for(let k of Object.keys(localStorage))if(k.startsWith("privora."))localStorage.removeItem(k);location.reload()}}
function modal(t,b){$("mt").textContent=t;$("mb").innerHTML=b;$("modal").classList.add("show")}$("mc").onclick=()=>$("modal").classList.remove("show");
$("security").onclick=()=>modal("Security status",`<p class=muted><b>This is a full-feature test sandbox, not production-secure E2EE.</b></p><p class=muted>Messages/media are routed through the relay in demo form and cached locally by the browser. The relay does not intentionally inspect message content, but this build does not yet implement audited Signal-family E2EE.</p><p class=muted>Do not send passwords, financial information or other real secrets.</p>`);
async function startCall(isVideo){if(!current)return toast("Choose a contact");if(!ws||ws.readyState!==1)return toast("Connect to relay first");try{localStream=await navigator.mediaDevices.getUserMedia({audio:true,video:isVideo});pc=new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"}]});localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));pc.ontrack=e=>$("remoteVideo").srcObject=e.streams[0];pc.onicecandidate=e=>e.candidate&&send({type:"signal",from:me,to:current,signal:{candidate:e.candidate}});$("localVideo").srcObject=localStream;$("callLabel").textContent="Calling "+current;$("callScreen").classList.add("show");let offer=await pc.createOffer();await pc.setLocalDescription(offer);send({type:"signal",from:me,to:current,signal:{offer}})}catch(e){toast("Camera/microphone permission is required")}}
$("voice").onclick=()=>startCall(false);$("video").onclick=()=>startCall(true);
async function handleSignal(m){if(m.to!==me)return;if(m.signal.offer){if(!pc){localStream=await navigator.mediaDevices.getUserMedia({audio:true,video:true});pc=new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"}]});localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));pc.ontrack=e=>$("remoteVideo").srcObject=e.streams[0];pc.onicecandidate=e=>e.candidate&&send({type:"signal",from:me,to:m.from,signal:{candidate:e.candidate}});$("localVideo").srcObject=localStream;$("callScreen").classList.add("show")}await pc.setRemoteDescription(m.signal.offer);let ans=await pc.createAnswer();await pc.setLocalDescription(ans);send({type:"signal",from:me,to:m.from,signal:{answer:ans}})}else if(m.signal.answer&&pc){await pc.setRemoteDescription(m.signal.answer)}else if(m.signal.candidate&&pc){try{await pc.addIceCandidate(m.signal.candidate)}catch{}}}
$("hang").onclick=()=>{if(pc){pc.close();pc=null}if(localStream){localStream.getTracks().forEach(t=>t.stop());localStream=null}$("callScreen").classList.remove("show");if(current)send({type:"signal",from:me,to:current,signal:{hang:true}})}
contacts=contacts.filter(x=>x!==me);renderContacts();render();
</script></body></html>
